<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Shlok's Canteen{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow sticky-top">
    <div class="container">

        <a class="navbar-brand fw-bold fs-3" href="{{ url_for('Home') }}">
            🍔 Shlok's Canteen
        </a>

        <button class="navbar-toggler" type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('Home') }}">🏠 Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('Menu') }}">🍽 Menu</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('cart_page') }}">🛒 Cart</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('About_us') }}">ℹ About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="{{ url_for('admin') }}">📊 Admin</a>
                </li>

            </ul>

        </div>

    </div>
</nav>

<div class="container mt-4">

{% block content %}
{% endblock %}

</div>

<footer class="bg-dark text-white text-center p-4 mt-5">
    <h5>🍔 Shlok's Canteen</h5>
    <p>Fresh Food • Fast Service • Best Quality</p>
    <hr>
    <p>© 2026 Shlok's Canteen | Built with Flask ❤️</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
