<!DOCTYPE html>
<html>
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Shlok's Canteen{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">

        <a class="navbar-brand fw-bold" href="{{ url_for('Home') }}">
            🍔 Shlok's Canteen
        </a>

        <div class="navbar-nav ms-auto">
            <a class="nav-link" href="{{ url_for('Home') }}">Home</a>
            <a class="nav-link" href="{{ url_for('Menu') }}">Menu</a>
            <a class="nav-link" href="{{ url_for('cart_page') }}">🛒 Cart</a>
            <a class="nav-link" href="{{ url_for('admin') }}">Admin</a>
            <a class="nav-link" href="{{ url_for('About_us') }}">About</a>
        </div>

    </div>
</nav>

        <hr>

        <div class="container mt-4">

{% block content %}
{% endblock %}

</div>

<footer class="bg-dark text-white text-center p-3 mt-5">
    © 2026 Shlok's Canteen | Built with Flask ❤️
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
</html>
